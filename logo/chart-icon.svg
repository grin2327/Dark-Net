<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- ব্লু-পার্পল গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E7BFF"/>
      <stop offset="100%" stop-color="#7A3EFF"/>
    </linearGradient>
  </defs>

  <!-- রাউন্ডেড স্কয়ার ব্যাকগ্রাউন্ড -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>

  <!-- চার্টের এল-শেপ অ্যাক্সিস (L-Axis) -->
  <path d="M 20 20 V 44 H 44" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- চার্টের ট্রেন্ড লাইন (Graph Line) -->
  <path d="M 25 36 L 32 28 L 38 32 L 44 24" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
