<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- ব্যাকগ্রাউন্ড গ্লো ইফেক্ট -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A26"/>
      <stop offset="100%" stop-color="#07070A"/>
    </radialGradient>

    <!-- ৪টি ঘরের নিয়ন গ্রেডিয়েন্ট কালার -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A9D"/>
      <stop offset="100%" stop-color="#D8006C"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55FF14"/>
      <stop offset="100%" stop-color="#28D200"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#0099FF"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A812FF"/>
      <stop offset="100%" stop-color="#6B00E5"/>
    </linearGradient>
  </defs>

  <!-- ডার্ক ব্যাকগ্রাউন্ড ক্যানভাস -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)"/>

  <!-- ২x২ গ্রিড ব্লক (ছবি অনুযায়ী ৪টি কালার) -->
  <!-- ১. উপরে-বামে (পিংক) -->
  <rect x="12" y="12" width="18" height="18" rx="4.5" fill="url(#pinkGrad)"/>
  <!-- ২. উপরে-ডানে (গ্রিন) -->
  <rect x="34" y="12" width="18" height="18" rx="4.5" fill="url(#greenGrad)"/>
  <!-- ৩. নিচে-বামে (সায়ান) -->
  <rect x="12" y="34" width="18" height="18" rx="4.5" fill="url(#cyanGrad)"/>
  <!-- ৪. নিচে-ডানে (পার্পল) -->
  <rect x="34" y="34" width="18" height="18" rx="4.5" fill="url(#purpleGrad)"/>
</svg>
